<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BARBEARIA FIDELIS - Campestre MG</title>
  <meta name="description" content="Agende seu horário na Barbearia Fidelis. Seg a Sáb das 09:00 às 18:30. Campestre - MG">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <img src="https://via.placeholder.com/120x120/000/D4AF37?text=FIDELIS" alt="Logo Barbearia Fidelis" class="logo">
    <h1>✂️ BARBEARIA FIDELIS ✂️</h1>
    <p>📍 Campestre - MG | Proprietário: @_douglasbarbeiro_</p>
    <a href="https://wa.me/55359999335278" target="_blank" class="whats">💬 Fale no WhatsApp</a>
  </header>

  <section id="galeria">
    <h2>Nossos Cortes</h2>
    <div id="fotos" class="grid-fotos">
      <p>Carregando fotos...</p>
    </div>
  </section>

  <section id="agendamento">
    <h2>Agende seu Horário</h2>
    <p class="horario">Seg a Sáb das 09:00 às 18:30</p>
    <form id="form-agendar">
      <input type="text" name="nome" placeholder="Seu nome completo" required>
      <input type="tel" name="telefone" placeholder="Seu WhatsApp (35) 9..." required>
      <input type="date" name="data" required>
      <select name="horario" required>
        <option value="">Selecione um horário</option>
      </select>
      <select name="servico">
        <option value="Corte">Corte - R$ 30</option>
        <option value="Barba">Barba - R$ 20</option>
        <option value="Corte + Barba">Corte + Barba - R$ 45</option>
        <option value="Sobrancelha">Sobrancelha - R$ 10</option>
      </select>
      <textarea name="obs" placeholder="Observação: Ex: Máquina 2, degradê..." rows="3"></textarea>
      <button type="submit">CONFIRMAR AGENDAMENTO</button>
    </form>
    <p id="msg"></p>
  </section>

  <footer>
    <p>Siga: @_barbeariafidelis_</p>
    <p>© 2026 Barbearia Fidelis</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
