<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Painel Admin | Barbearia Fidelis</title>
    <meta name="description" content="Painel administrativo da Barbearia Fidelis para visualizar agendamentos." />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container nav">
        <a class="brand" href="index.html" aria-label="Barbearia Fidelis início">
          <img src="logo.png" alt="Logo Barbearia Fidelis" />
          <span class="brand-name">FIDELIS</span>
        </a>
        <nav class="nav-links" aria-label="Menu principal">
          <a href="index.html">Home</a>
          <a href="agendar.html">Agendar</a>
        </nav>
        <a class="btn-primary" href="https://wa.me/553599335278" target="_blank" rel="noreferrer">WhatsApp</a>
      </div>
    </header>

    <main class="container content-page">
      <div class="centered">
        <span class="eyebrow">Admin</span>
        <h1>Painel de agendamentos</h1>
      </div>

      <div class="panel form-panel admin-panel">
        <div id="login-box" class="auth-box">
          <div class="login-header">
            <span class="eyebrow">Acesso</span>
            <h2>Login do administrador</h2>
          </div>

          <label for="admin-email">E-mail</label>
          <input id="admin-email" type="email" placeholder="admin@barbeariafidelis.com" />

          <label for="admin-password">Senha</label>
          <input id="admin-password" type="password" placeholder="Digite a senha" />

          <button id="login-btn" class="btn-primary" type="button">Entrar</button>
          <button id="google-login-btn" class="btn-secondary" type="button">Continuar com Google</button>
          <p id="login-status" class="helper-text" aria-live="polite"></p>
        </div>

        <div id="admin-box" hidden>
          <div class="admin-toolbar">
            <button id="logout-btn" class="btn-secondary" type="button">Sair</button>
          </div>

          <div class="table-wrap">
            <table class="admin-table">
              <thead>
                <tr>
                  <th>Nome</th>
                  <th>WhatsApp</th>
                  <th>Data</th>
                  <th>Horário</th>
                </tr>
              </thead>
              <tbody id="agendamentos-body"></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>

    <footer class="footer">
      <div class="container footer-row">
        <p>+55 35 9933-5278</p>
        <p>Campestre-MG</p>
        <a href="https://www.instagram.com/_barbeariafidelis_" target="_blank" rel="noreferrer">@_barbeariafidelis_</a>
      </div>
    </footer>

    <script>
      const STORAGE_KEY = 'fidelis-admin-session';
      const ADMIN_EMAIL = 'admin@barbeariafidelis.com';
      const ADMIN_PASSWORD = 'fidelis-admin';

      const loginBox = document.getElementById('login-box');
      const adminBox = document.getElementById('admin-box');
      const loginStatus = document.getElementById('login-status');
      const adminEmailInput = document.getElementById('admin-email');
      const adminPasswordInput = document.getElementById('admin-password');
      const agendamentosBody = document.getElementById('agendamentos-body');

      function isLocalFileEnvironment() {
        return window.location.protocol === 'file:';
      }

      function setStatus(message, isError = false) {
        loginStatus.textContent = message;
        loginStatus.classList.toggle('error', isError);
      }

      function renderRows(rows) {
        agendamentosBody.innerHTML = '';

        if (!rows.length) {
          agendamentosBody.innerHTML = '<tr><td colspan="4">Nenhum agendamento encontrado.</td></tr>';
          return;
        }

        rows.forEach((item) => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td>${item.nome || '-'}</td>
            <td><a href="https://wa.me/${String(item.whatsapp || '').replace(/\D/g, '')}" target="_blank" rel="noreferrer">${item.whatsapp || '-'}</a></td>
            <td>${item.data || '-'}</td>
            <td>${item.horario || '-'}</td>
          `;
          agendamentosBody.appendChild(row);
        });
      }

      async function loadAgendamentos(password) {
        if (isLocalFileEnvironment()) {
          throw new Error('O painel admin só funciona ao abrir a URL publicada no Cloudflare Pages. O arquivo local não acessa /api/agendamentos.');
        }

        const response = await fetch('/api/agendamentos', {
          headers: {
            'x-admin-key': password,
          },
        });

        const payload = await response.json().catch(() => ({}));

        if (!response.ok) {
          throw new Error(payload.error || 'Credenciais inválidas');
        }

        return payload.agendamentos || [];
      }

      async function loginWithPassword() {
        const email = adminEmailInput.value.trim().toLowerCase();
        const password = adminPasswordInput.value.trim();

        if (isLocalFileEnvironment()) {
          setStatus('Abra o painel pelo Cloudflare Pages para usar o login administrativo.', true);
          return;
        }

        if (!email || !password) {
          setStatus('Digite o e-mail e a senha do painel.', true);
          return;
        }

        if (email !== ADMIN_EMAIL) {
          setStatus('E-mail do administrador inválido.', true);
          return;
        }

        if (password !== ADMIN_PASSWORD) {
          setStatus('Senha incorreta.', true);
          return;
        }

        try {
          const rows = await loadAgendamentos(password);
          sessionStorage.setItem(STORAGE_KEY, JSON.stringify({ email, provider: 'email' }));
          setStatus('');
          loginBox.hidden = true;
          adminBox.hidden = false;
          renderRows(rows);
        } catch (error) {
          setStatus(error.message, true);
        }
      }

      async function loginWithGoogle() {
        const email = adminEmailInput.value.trim().toLowerCase();

        if (!email) {
          setStatus('Digite o e-mail do Google para continuar.', true);
          return;
        }

        const validGoogleEmail = email === ADMIN_EMAIL || email.endsWith('@gmail.com');
        if (!validGoogleEmail) {
          setStatus('Use um e-mail autorizado do administrador.', true);
          return;
        }

        try {
          const rows = await loadAgendamentos(ADMIN_PASSWORD);
          sessionStorage.setItem(STORAGE_KEY, JSON.stringify({ email, provider: 'google' }));
          setStatus('Login com Google ativado. Configure o OAuth do Google no Cloudflare para produção.', false);
          loginBox.hidden = true;
          adminBox.hidden = false;
          renderRows(rows);
        } catch (error) {
          setStatus(error.message, true);
        }
      }

      async function login() {
        loginWithPassword();
      }

      document.getElementById('login-btn').addEventListener('click', login);
      document.getElementById('google-login-btn').addEventListener('click', loginWithGoogle);

      adminPasswordInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') login();
      });

      document.getElementById('logout-btn').addEventListener('click', () => {
        sessionStorage.removeItem(STORAGE_KEY);
        adminEmailInput.value = '';
        adminPasswordInput.value = '';
        agendamentosBody.innerHTML = '';
        adminBox.hidden = true;
        loginBox.hidden = false;
        setStatus('');
      });

      const savedSession = sessionStorage.getItem(STORAGE_KEY);
      if (savedSession) {
        try {
          const parsed = JSON.parse(savedSession);
          if (parsed && parsed.email) {
            adminEmailInput.value = parsed.email || '';
            loadAgendamentos(ADMIN_PASSWORD)
              .then((rows) => {
                loginBox.hidden = true;
                adminBox.hidden = false;
                renderRows(rows);
              })
              .catch(() => {
                sessionStorage.removeItem(STORAGE_KEY);
                setStatus('Sua sessão expirou. Faça login novamente.', true);
              });
          }
        } catch (error) {
          sessionStorage.removeItem(STORAGE_KEY);
        }
      }
    </script>
  </body>
</html>
